<line class="ln" x1="854" y1="864" x2="770" y2="920" marker-end="url(#ah)"/>

<path class="lnd" d="M770 1030 L770 1060 L124 1060 L124 522" marker-end="url(#ah)"/><text x="440" y="1052" class="e">weekly retrain trigger (feedback loop)</text>

<text x="28" y="1200" class="l" font-size="10">Stack: BERT (HF Transformers) · PyTorch · MLflow · MinIO · Docker / Docker Compose · Kubernetes (kubespray) · Helm · ArgoCD · Argo Workflows/Events · Terraform · Ansible · Prometheus/Grafana · Chameleon Cloud (KVM@TACC)</text>
