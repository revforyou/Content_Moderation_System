<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1240" viewBox="0 0 1000 1240" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
<title>Content Moderation System — MLOps system design</title>
<desc>Full topology: Jigsaw dataset ETL via Docker Compose into Chameleon object store; Terraform/Ansible provisioning a 3-node Kubernetes cluster; BERT training tracked in MLflow with a MinIO-backed registry; Argo Workflows chaining train, build, promote, and deploy steps; ArgoCD GitOps syncing Helm charts across canary, staging, and production; Prometheus/Grafana observability; simulated production traffic feeding a weekly retrain loop.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#84add9"/></marker>
<style>
.b{fill:#163a4e;stroke:#5f8aa4;stroke-width:1}
.p{stroke:#a78bfa}.t2{stroke:#2dd4bf}.a{stroke:#fbbf24}.c{stroke:#fb923c}.bl{stroke:#60a5fa}.g{stroke:#4ade80}
.buk{fill:none;stroke:#52809a;stroke-width:1;stroke-dasharray:5 4}
.t{fill:#eaf1f7;font-size:13px;font-weight:600;text-anchor:middle}
.s{fill:#a2bfcf;font-size:10.5px;text-anchor:middle}
.h{fill:#c2dae8;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.l{fill:#b7d0df;font-size:10.5px}
.ln{stroke:#84add9;stroke-width:1.4;fill:none}
.lnd{stroke:#6f97ad;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.e{fill:#84add9;font-size:9.5px;font-style:italic;text-anchor:middle}
</style>
</defs>
<rect x="1" y="1" width="998" height="1238" rx="16" fill="#0f2a3a"/>
<text x="28" y="40" class="h" font-size="18">Content Moderation System — MLOps System Design</text>
<text x="28" y="60" class="l" font-size="11">BERT toxicity classifier · Chameleon Cloud (KVM@TACC) · canary → staging → production · GitOps + workflow-driven retraining</text>

<!-- LEFT COLUMN: infra provisioning -->
<rect class="buk a" x="28" y="86" width="192" height="112" rx="9"/><text x="124" y="106" class="h" text-anchor="middle">Terraform · IaC</text>
<text x="40" y="128" class="l">OpenStack / Chameleon</text><text x="40" y="146" class="l">3× m1.medium VMs</text><text x="40" y="164" class="l">private net · block vol</text><text x="40" y="182" class="l">Swift object container</text>

<rect class="buk a" x="28" y="210" width="192" height="112" rx="9"/><text x="124" y="230" class="h" text-anchor="middle">Ansible</text>
<text x="40" y="252" class="l">pre/post k8s config</text><text x="40" y="270" class="l">installs kubeadm cluster</text><text x="40" y="288" class="l">installs ArgoCD +</text><text x="40" y="304" class="l">Argo Workflows/Events</text>
<line class="ln" x1="124" y1="198" x2="124" y2="210" marker-end="url(#ah)"/>

<rect class="buk" x="28" y="334" width="192" height="96" rx="9"/><text x="124" y="354" class="h" text-anchor="middle">Networking</text>
<text x="40" y="376" class="l">security groups (SSH,</text><text x="40" y="392" class="l">8080/8000/9090…)</text><text x="40" y="408" class="l">insecure in-cluster registry</text>

<rect class="buk c" x="28" y="442" width="192" height="80" rx="9"/><text x="124" y="462" class="h" text-anchor="middle">Git</text>
<text x="40" y="484" class="l">push → ArgoCD auto-sync</text><text x="40" y="500" class="l">Helm chart changes</text>

<!-- TOP BAND: data source + ETL -->
<rect class="b bl" x="240" y="86" width="170" height="48" rx="6"/><text x="325" y="107" class="t">Kaggle · Jigsaw</text><text x="325" y="122" class="s">unintended-bias-toxicity</text>

<rect class="buk" x="240" y="150" width="330" height="172" rx="10"/><text x="252" y="170" class="h">ETL · Docker Compose (3 containers)</text>
<rect class="b" x="252" y="182" width="306" height="36" rx="5"/><text x="405" y="204" class="t" font-size="11">extract — kaggle API → volume</text>
<rect class="b" x="252" y="226" width="306" height="36" rx="5"/><text x="405" y="248" class="t" font-size="11">transform — filter/sort/split 90:10</text>
<rect class="b" x="252" y="270" width="306" height="36" rx="5"/><text x="405" y="292" class="t" font-size="11">load — rclone → object store</text>
<line class="ln" x1="325" y1="134" x2="325" y2="150" marker-end="url(#ah)"/>

<rect class="buk t2" x="600" y="170" width="200" height="90" rx="9"/><text x="700" y="190" class="h" text-anchor="middle">Chameleon Object Store</text><text x="700" y="210" class="s">Swift · raw + split CSVs</text><text x="700" y="228" class="s">block volume · checkpoints</text>
<line class="ln" x1="570" y1="288" x2="600" y2="288" marker-end="url(#ah)"/><text x="585" y="278" class="e">rclone copy</text>

<!-- KUBERNETES CLUSTER big container -->
<rect class="buk bl" x="240" y="336" width="732" height="560" rx="10"/><text x="252" y="356" class="h">Kubernetes Cluster · Chameleon KVM@TACC (kubespray, 3 nodes)</text>
<line class="lnd" d="M700 260 L700 300 L500 300 L500 336" marker-end="url(#ah)"/><text x="560" y="292" class="e">mounted as volume</text>

<rect class="b t2" x="252" y="374" width="222" height="76" rx="6"/><text x="363" y="396" class="t" font-size="11.5">MLflow + MinIO</text><text x="363" y="412" class="s">registry · artifact store</text><text x="363" y="428" class="s">alias = env (canary/stg/prod)</text>

<rect class="b" x="490" y="374" width="212" height="76" rx="6"/><text x="596" y="396" class="t" font-size="11.5">In-cluster Registry</text><text x="596" y="412" class="s">insecure registry:5000</text><text x="596" y="428" class="s">image tag = env-version</text>

<rect class="b p" x="718" y="374" width="238" height="76" rx="6"/><text x="837" y="396" class="t" font-size="11.5">Model Training</text><text x="837" y="412" class="s">BERT-base · single A100</text><text x="837" y="428" class="s">PyTorch · MLflow logging</text>
<line class="ln" x1="474" y1="412" x2="490" y2="412" marker-end="url(#ah)"/>
<line class="ln" x1="837" y1="374" x2="474" y2="412" marker-end="url(#ah)"/><text x="655" y="368" class="e">log_metric / log_model</text>

<rect class="buk a" x="252" y="470" width="704" height="112" rx="9"/><text x="264" y="490" class="h">Argo Workflows — train → build → promote → deploy</text>
<rect class="b a" x="264" y="502" width="150" height="60" rx="5"/><text x="339" y="524" class="t" font-size="10">trigger-training</text><text x="339" y="540" class="s" font-size="9">POST :9090/trigger</text>
<rect class="b a" x="428" y="502" width="150" height="60" rx="5"/><text x="503" y="524" class="t" font-size="10">build-container</text><text x="503" y="540" class="s" font-size="9">tag = model version</text>
<rect class="b a" x="592" y="502" width="150" height="60" rx="5"/><text x="667" y="518" class="t" font-size="10">promote-model</text><text x="667" y="534" class="s" font-size="9">skopeo retag +</text><text x="667" y="548" class="s" font-size="9">set mlflow alias</text>
<rect class="b a" x="756" y="502" width="180" height="60" rx="5"/><text x="846" y="524" class="t" font-size="10">deploy-container</text><text x="846" y="540" class="s" font-size="9">Helm upgrade in env</text>
<line class="ln" x1="414" y1="532" x2="428" y2="532" marker-end="url(#ah)"/>
<line class="ln" x1="578" y1="532" x2="592" y2="532" marker-end="url(#ah)"/>
<line class="ln" x1="742" y1="532" x2="756" y2="532" marker-end="url(#ah)"/>
<line class="ln" x1="837" y1="450" x2="339" y2="502" marker-end="url(#ah)"/>

<rect class="b" x="252" y="598" width="230" height="60" rx="6"/><text x="367" y="620" class="t" font-size="11.5">ArgoCD</text><text x="367" y="636" class="s">GitOps sync · Helm charts</text><text x="367" y="650" class="s">canary/staging/prod values.yaml</text>
<rect class="b" x="726" y="598" width="230" height="60" rx="6"/><text x="841" y="620" class="t" font-size="11.5">Argo Events</text><text x="841" y="636" class="s">event-driven triggers</text><text x="841" y="650" class="s">(webhook / cron sensors)</text>
<line class="ln" x1="482" y1="628" x2="726" y2="628" marker-end="url(#ah)" opacity="0"/>

<rect class="buk g" x="252" y="674" width="230" height="190" rx="9"/><text x="367" y="694" class="h" text-anchor="middle">Canary</text><text x="367" y="712" class="s">1 replica · 200m/128Mi</text>
<rect class="b g" x="264" y="726" width="206" height="46" rx="5"/><text x="367" y="746" class="t" font-size="10.5">FastAPI · /predict</text><text x="367" y="760" class="s" font-size="9">image: canary-1.0.N</text>

<rect class="buk t2" x="502" y="674" width="230" height="190" rx="9"/><text x="617" y="694" class="h" text-anchor="middle">Staging</text><text x="617" y="712" class="s">replica · validation traffic</text>
<rect class="b t2" x="514" y="726" width="206" height="46" rx="5"/><text x="617" y="746" class="t" font-size="10.5">FastAPI · /predict</text><text x="617" y="760" class="s" font-size="9">image: staging-1.0.N</text>

<rect class="buk p" x="752" y="674" width="204" height="190" rx="9"/><text x="854" y="694" class="h" text-anchor="middle">Production</text><text x="854" y="712" class="s">live inference</text>
<rect class="b p" x="764" y="726" width="180" height="46" rx="5"/><text x="854" y="746" class="t" font-size="10.5">FastAPI · /predict</text><text x="854" y="760" class="s" font-size="9">image: prod-1.0.N</text>

<line class="ln" x1="482" y1="770" x2="502" y2="770" marker-end="url(#ah)"/><text x="492" y="796" class="e" transform="rotate(90 492 796)">retag</text>
<line class="ln" x1="732" y1="770" x2="752" y2="770" marker-end="url(#ah)"/><text x="742" y="796" class="e" transform="rotate(90 742 796)">retag</text>
<line class="lnd" x1="367" y1="598" x2="367" y2="562" marker-end="url(#ah)"/>
<line class="lnd" x1="617" y1="598" x2="617" y2="562" marker-end="url(#ah)"/>
<line class="lnd" x1="854" y1="598" x2="854" y2="562" marker-end="url(#ah)"/>

<!-- OBSERVABILITY + TRAFFIC below cluster -->
<rect class="buk c" x="252" y="920" width="300" height="110" rx="9"/><text x="402" y="940" class="h" text-anchor="middle">Prometheus + Grafana</text><text x="402" y="960" class="s">scrape /metrics · pod CPU/mem</text><text x="402" y="978" class="s">latency + prediction distribution</text><text x="402" y="996" class="s">canary vs staging vs prod boards</text>
